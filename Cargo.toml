[workspace]
members = [
    "crates/assistant",
    "crates/inject-probe",
    "crates/injected",
    "crates/protocol",
    "crates/symbols",
    "tools/update-signer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wulfenbach-jpg/azazels-coe5-assistant"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
crossbeam-channel = "0.5.15"
directories = "6.0.0"
ed25519-dalek = "3.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.36.1"
egui_dock = { version = "0.21.1", features = ["serde"] }
global-hotkey = "0.8.0"
iced-x86 = "1.21.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored", "send", "serde"] }
parking_lot = "0.12.5"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.18"
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tray-icon = { version = "0.24.2", default-features = false, features = ["common-controls-v6"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
windows = { version = "0.62.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
debug = 1
lto = "thin"
panic = "abort"
